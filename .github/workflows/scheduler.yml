# Calls DevFlow's scheduler so scheduled workflows run. Optional: use any other caller instead (Vercel Cron on a paid plan, cron-job.org...).
# Setup: in the GitHub repo go to Settings > Secrets and variables > Actions and add
#   APP_URL      your deployed address, e.g. https://app.example.com
#   CRON_SECRET  the same value as CRON_SECRET in your hosting environment
# Honest limits: GitHub treats this schedule as best effort. Measured on this repo, runs were 3 to 10 hours apart (median about 6),
# not every 5 minutes, and GitHub pauses scheduled workflows in repositories with no activity for 60 days. Use this as a backup.
# For schedules that fire on time, point cron-job.org (or similar) at /api/cron/tick every minute. See DEPLOYMENT.md.
name: Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and CRON_SECRET aren't set as repository secrets yet, so nothing was called. This run is green but did nothing."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/tick"
